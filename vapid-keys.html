<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 키 만들기 (VAPID)</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #1C2030; }
  button { font: inherit; padding: 12px 18px; border: 0; border-radius: 10px; background: #4F7CFF; color: #fff; font-weight: 700; cursor: pointer; }
  label { display: block; margin-top: 22px; font-weight: 700; }
  textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 10px; border: 1px solid #DDE; border-radius: 8px; height: 64px; }
  p { color: #555; line-height: 1.6; }
</style>
</head>
<body>
<h2>🔑 알림 키 만들기</h2>
<p>푸시 알림에 필요한 키 한 쌍을 이 컴퓨터 안에서 만들어요. 키는 어디로도 전송되지 않아요.<br>
<b>한 번만</b> 만들고, 다시 만들면 가족 모두 알림을 다시 켜야 하니 잘 보관해 주세요.</p>
<button id="go">키 만들기</button>

<label>공개 키 (Public Key) → config.js 의 VAPID_PUBLIC_KEY, Supabase Secrets 의 VAPID_PUBLIC_KEY</label>
<textarea id="pub" readonly></textarea>
<label>비공개 키 (Private Key) → Supabase Secrets 의 VAPID_PRIVATE_KEY 에만 (다른 곳에 올리지 마세요)</label>
<textarea id="priv" readonly></textarea>

<script>
const b64url = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
document.getElementById("go").onclick = async () => {
  const pair = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const raw = await crypto.subtle.exportKey("raw", pair.publicKey);   // 65바이트
  const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);  // d = 32바이트
  document.getElementById("pub").value = b64url(raw);
  document.getElementById("priv").value = jwk.d;
};
</script>
</body>
</html>
