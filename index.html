<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>가족캘린더</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가족캘린더">
<meta name="theme-color" content="#F6F7FB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<style>
  :root {
    --bg: #F6F7FB; --card: #FFFFFF; --text: #1C2030; --sub: #7A8094; --line: #E7E9F0;
    --accent: #4F7CFF; --sun: #E5484D; --sat: #3E7BFA; --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* ---------- 로그인 / 가입 ---------- */
  .auth { max-width: 380px; margin: 0 auto; padding: 56px 24px; }
  .auth h1 { font-size: 28px; margin: 12px 0 4px; }
  .auth p.sub { color: var(--sub); margin: 0 0 28px; }
  .logo { width: 64px; height: 64px; border-radius: 18px; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .field span em { font-style: normal; color: var(--accent); }
  .field input, .field textarea { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); font-size: 16px; color: var(--text); }
  .field input.bad { border-color: var(--sun); }
  .field textarea { min-height: 70px; resize: none; }
  .field input[type=date], .field input[type=time] { min-height: 48px; min-width: 0; -webkit-appearance: none; appearance: none; text-align: left; }
  .row2 > * { min-width: 0; }
  .btn { width: 100%; padding: 15px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.gray { background: #EEF0F5; color: var(--text); }
  .btn.danger { background: #FDECEC; color: var(--sun); }
  .btn:disabled { opacity: .5; }
  .msg { min-height: 20px; font-size: 14px; color: var(--sun); margin: 6px 0 10px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }

  /* ---------- 상단 ---------- */
  header { display: flex; align-items: center; padding: 10px 16px 6px; gap: 6px; }
  header h2 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -0.3px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; color: var(--sub); }
  .icon-btn:active { background: #E9ECF3; }
  .today-btn { font-size: 13px; padding: 6px 10px; border-radius: 10px; background: #E9ECF3; color: var(--text); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; color: #2B3040; font-size: 12.5px; font-weight: 700; display: grid; place-items: center; margin-left: 4px; letter-spacing: -0.5px; }
  .legend { display: flex; gap: 12px; padding: 0 18px 8px; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .banner { margin: 0 12px 8px; padding: 11px 14px; border-radius: 12px; background: #FFF4DB; color: #7A5600; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .banner b { font-weight: 700; }
  .banner button { margin-left: auto; font-weight: 700; color: #7A5600; white-space: nowrap; }

  /* ---------- 달력 ---------- */
  .cal { margin: 0 8px; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 2px rgba(20,30,60,.04); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; color: var(--sub); text-align: center; padding: 8px 0 6px; }
  .dow div:first-child { color: var(--sun); } .dow div:last-child { color: var(--sat); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .day { min-height: 92px; border-top: 1px solid var(--line); padding: 4px 2px 3px; overflow: hidden; position: relative; }
  .day .num { font-size: 13px; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; margin: 0 auto 2px; }
  .day.out .num, .day.out .bar { opacity: .35; }
  .day.sun .num { color: var(--sun); } .day.sat .num { color: var(--sat); }
  .day.today .num { background: var(--accent); color: #fff; font-weight: 700; }
  .day.sel { background: #F1F4FF; }
  .bar { font-size: 10.5px; line-height: 16px; height: 16px; padding: 0 4px; margin-bottom: 2px; border-radius: 4px; color: #2B3040;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
  .more { font-size: 10px; color: var(--sub); padding-left: 3px; }
  /* 공모주: 작고 흐리게, 가족 일정 아래 */
  .ipo { font-size: 8.5px; line-height: 12px; color: var(--sub); opacity: .55; padding: 0 3px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; letter-spacing: -0.4px; }
  .day.out .ipo { opacity: .25; }

  /* ---------- 선택한 날 목록 ---------- */
  .daylist { margin: 12px 8px 110px; background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
  .daylist h3 { margin: 0 0 10px; font-size: 16px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .dot { width: 4px; align-self: stretch; border-radius: 4px; }
  .item .t { font-weight: 600; font-size: 15px; }
  .item .m { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .empty { color: var(--sub); font-size: 14px; padding: 6px 0 4px; }
  .ipo-sec { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--sub); opacity: .6; display: flex; gap: 12px; }

  .fab { position: fixed; right: 20px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 20px;
    background: var(--accent); color: #fff; font-size: 30px; box-shadow: 0 8px 20px rgba(79,124,255,.35); }

  /* ---------- 아래에서 올라오는 창 ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(15,20,35,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; z-index: 11;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s ease;
    max-height: 92vh; overflow-y: auto; }
  .sheet.show { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #DADDE6; margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 16px; font-size: 19px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 14px; font-size: 15px; }
  .actions { display: grid; gap: 8px; margin-top: 6px; }

  /* ---------- 마이페이지 ---------- */
  .me-card { display: flex; align-items: center; gap: 14px; padding: 4px 0 18px; }
  .me-card .avatar { width: 52px; height: 52px; font-size: 17px; margin: 0; }
  .me-card b { font-size: 19px; display: block; }
  .me-card small { color: var(--sub); font-size: 13px; }
  .sec-title { font-size: 13px; font-weight: 700; color: var(--sub); margin: 18px 0 4px; }
  .box { background: #F6F7FB; border-radius: 14px; padding: 2px 14px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .box .set-row:first-child { border-top: 0; }
  .set-row small { color: var(--sub); display: block; font-size: 12.5px; margin-top: 2px; }
  .pill { font-size: 13px; padding: 7px 12px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap; }
  .pill.off { background: #E4E7EF; color: var(--sub); }
  /* iOS 스타일 스위치 */
  .sw { position: relative; width: 51px; height: 31px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; position: absolute; }
  .sw span { position: absolute; inset: 0; background: #D9DCE5; border-radius: 31px; transition: background .2s; }
  .sw span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 4px rgba(0,0,0,.18); transition: transform .2s; }
  .sw input:checked + span { background: #34C759; }
  .sw input:checked + span::after { transform: translateX(20px); }
  .sw input:disabled + span { opacity: .5; }

  .toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1C2030; color: #fff;
    padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.show { opacity: 1; }
  .demo { text-align: center; font-size: 12px; background: #E9ECF3; color: var(--sub); padding: 6px; }
</style>
</head>
<body>

<div id="demoBar" class="demo hidden">데모 모드 · 가짜 데이터로 미리보기 중</div>

<!-- 로그인 / 회원가입 -->
<section id="authView" class="auth hidden">
  <img class="logo" src="icon-192.png" alt="">
  <h1 id="authTitle">가족캘린더</h1>
  <p class="sub" id="authSub">우리 가족 일정을 한곳에서</p>
  <label class="field hidden" id="nameWrap"><span>이름 <em>성을 뺀 2글자</em></span>
    <input id="signName" placeholder="예: 지수" autocomplete="off"></label>
  <label class="field"><span>이메일</span><input id="email" type="email" autocomplete="email" inputmode="email"></label>
  <label class="field"><span>비밀번호 (6자 이상)</span><input id="password" type="password" autocomplete="current-password"></label>
  <div class="msg" id="authMsg"></div>
  <div class="actions">
    <button class="btn" id="authBtn">로그인</button>
    <button class="btn ghost" id="authSwitch">처음이에요 · 회원가입</button>
  </div>
</section>

<!-- (메일 인증 등으로 이름이 저장 안 됐을 때만) 이름 입력 -->
<section id="profileView" class="auth hidden">
  <h1>반가워요 👋</h1>
  <p class="sub">가족에게 보일 이름을 입력해 주세요</p>
  <label class="field"><span>이름 <em>성을 뺀 2글자</em></span><input id="pfName" placeholder="예: 지수"></label>
  <div class="msg" id="pfMsg"></div>
  <button class="btn" id="pfSave">시작하기</button>
</section>

<!-- 메인 -->
<main id="mainView" class="hidden">
  <header>
    <h2 id="monthTitle"></h2>
    <button class="today-btn" id="todayBtn">오늘</button>
    <button class="icon-btn" id="prevBtn" aria-label="이전 달">‹</button>
    <button class="icon-btn" id="nextBtn" aria-label="다음 달">›</button>
    <button class="avatar" id="myBtn" aria-label="마이페이지"></button>
  </header>
  <div class="legend" id="legend"></div>
  <div class="banner hidden" id="pushBanner"></div>
  <div class="cal">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="daylist">
    <h3 id="dayTitle"></h3>
    <div id="dayItems"></div>
  </div>
  <button class="fab" id="addBtn" aria-label="일정 추가">+</button>
</main>

<div class="scrim" id="scrim"></div>

<!-- 일정 추가/수정 -->
<div class="sheet" id="evSheet">
  <div class="grab"></div>
  <h3 id="evHead">일정 추가</h3>
  <label class="field"><span>무슨 일정인가요?</span><input id="evTitle" placeholder="예: 치과, 할머니 생신"></label>
  <div class="row2">
    <label class="field"><span>날짜</span><input id="evDate" type="date"></label>
    <label class="field"><span>마지막 날 (여러 날일 때)</span><input id="evEnd" type="date"></label>
  </div>
  <div class="toggle"><span>하루 종일</span><label class="sw"><input type="checkbox" id="evAllDay" checked><span></span></label></div>
  <label class="field hidden" id="evTimeWrap"><span>시간</span><input id="evTime" type="time" value="09:00"></label>
  <label class="field"><span>메모 (선택)</span><textarea id="evMemo"></textarea></label>
  <div class="msg" id="evMsg"></div>
  <div class="actions">
    <button class="btn" id="evSave">저장</button>
    <button class="btn danger hidden" id="evDel">삭제</button>
    <button class="btn gray" id="evCancel">닫기</button>
  </div>
</div>

<!-- 마이페이지 -->
<div class="sheet" id="mySheet">
  <div class="grab"></div>
  <h3>마이페이지</h3>
  <div class="me-card"><div class="avatar" id="myAvatar"></div><div><b id="myName"></b><small id="myEmail"></small></div></div>

  <div class="sec-title">알림 설정</div>
  <div class="box">
    <div class="set-row"><div>이 폰으로 알림 받기<small id="pushState">확인 중…</small></div><button class="pill" id="pushBtn">알림 켜기</button></div>
    <div class="set-row"><div>가족 일정 알림<small>일정 당일 오전 10시 · 가족 모두의 일정</small></div><label class="sw"><input type="checkbox" data-alert="alert_events"><span></span></label></div>
    <div class="set-row"><div>청약 마감 알림<small>마감일 오전 10시 · 종목·증권사 상세</small></div><label class="sw"><input type="checkbox" data-alert="alert_closing"><span></span></label></div>
    <div class="set-row"><div>상장 알림<small>상장 전날 밤 10시 · 종목 상세</small></div><label class="sw"><input type="checkbox" data-alert="alert_listing"><span></span></label></div>
    <div class="set-row"><div>테스트 알림<small>지금 설정대로 이 폰에 보내봐요</small></div><button class="pill" id="testBtn">보내기</button></div>
  </div>

  <div class="sec-title">내 정보</div>
  <div class="box" style="padding:14px">
    <label class="field"><span>이름 <em>성을 뺀 2글자</em></span><input id="myNameInput"></label>
    <span style="font-size:13px;color:var(--sub)">내 일정 색</span>
    <div class="swatches" id="mySwatches" style="margin:8px 0 14px"></div>
    <button class="btn gray" id="mySave">저장</button>
  </div>

  <div class="actions" style="margin-top:14px">
    <button class="btn ghost" id="logoutBtn">로그아웃</button>
    <button class="btn gray" id="myClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const CFG = window.FAMILY_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL || new URLSearchParams(location.search).has("demo");
// 파스텔 일정 색 (하늘, 핑크, 민트, 살구, 라벤더, 레몬)
const COLORS = ["#A9C7FF", "#FFB8CB", "#A6E3C4", "#FFCFA3", "#D3C2FF", "#FFE89A"];
// 예전 진한 색으로 저장된 사람은 비슷한 파스텔로 보여주기
const OLD_TO_PASTEL = { "#4F7CFF": "#A9C7FF", "#FF6B8A": "#FFB8CB", "#2EB67D": "#A6E3C4", "#F5A524": "#FFCFA3", "#9B6BFF": "#D3C2FF", "#14B8C4": "#FFE89A" };
const pastel = (list) => list.map((p) => ({ ...p, color: OLD_TO_PASTEL[(p.color || "").toUpperCase()] || p.color }));
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const $ = (id) => document.getElementById(id);

// ---------- 도우미 ----------
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NAME_OK = /^[가-힣]{2}$/;
const nameError = (n) => (NAME_OK.test(n) ? "" : "이름은 성을 뺀 한글 2글자로 입력해 주세요. (예: 지수)");

function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- 데이터 (Supabase 또는 데모) ----------
let api;
if (DEMO) {
  $("demoBar").classList.remove("hidden");
  const t = todayStr();
  const people = [
    { id: "u1", name: "민정", color: "#FFB8CB", alert_events: true, alert_closing: true, alert_listing: true },
    { id: "u2", name: "준호", color: "#A9C7FF", alert_events: true, alert_closing: false, alert_listing: false },
    { id: "u3", name: "지수", color: "#A6E3C4", alert_events: true, alert_closing: true, alert_listing: false },
  ];
  const ipoDemo = [
    { kind: "closing", event_date: t }, { kind: "listing", event_date: t },
    { kind: "listing", event_date: addDays(t, 2) },
    { kind: "closing", event_date: addDays(t, 7) }, { kind: "closing", event_date: addDays(t, 7) }, { kind: "closing", event_date: addDays(t, 7) },
    { kind: "listing", event_date: addDays(t, 6) }, { kind: "listing", event_date: addDays(t, 11) },
    { kind: "closing", event_date: addDays(t, 14) }, { kind: "listing", event_date: addDays(t, 14) },
  ];
  let evs = [
    { id: "e1", owner_id: "u1", title: "치과 정기검진", event_date: t, start_time: "10:30" },
    { id: "e2", owner_id: "u3", title: "토익스피킹 시험", event_date: addDays(t, 3), start_time: "09:00" },
    { id: "e3", owner_id: "u2", title: "회식", event_date: addDays(t, 2), start_time: "18:30" },
    { id: "e4", owner_id: "u2", title: "출장", event_date: addDays(t, 6), end_date: addDays(t, 8) },
    { id: "e5", owner_id: "u1", title: "할머니 생신", event_date: addDays(t, 11) },
    { id: "e6", owner_id: "u3", title: "미용실", event_date: t, start_time: "15:00" },
    { id: "e7", owner_id: "u1", title: "요가", event_date: addDays(t, -2), start_time: "07:00" },
  ];
  api = {
    async session() { return { id: "u3", email: "jisu@example.com" }; },
    async profiles() { return people; },
    async saveProfile(p) { Object.assign(people.find((x) => x.id === "u3"), p); },
    async events() { return evs; },
    async ipos() { return ipoDemo; },
    async saveEvent(e) { if (e.id) evs = evs.map((x) => (x.id === e.id ? { ...x, ...e } : x)); else evs.push({ ...e, id: "e" + Date.now(), owner_id: "u3" }); },
    async deleteEvent(id) { evs = evs.filter((x) => x.id !== id); },
    async signOut() { toast("데모 모드에서는 로그아웃이 없어요"); },
    async saveSubscription() {}, async testPush() { toast("데모 모드에서는 알림을 보낼 수 없어요"); },
  };
} else {
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const must = ({ data, error }) => { if (error) throw error; return data; };
  api = {
    async session() { const { data } = await sb.auth.getSession(); return data.session?.user ?? null; },
    async signIn(email, password) { must(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, name) {
      const d = must(await sb.auth.signUp({ email, password, options: { data: { name } } }));
      if (!d.session) throw new Error("가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.");
    },
    async signOut() { await sb.auth.signOut(); location.reload(); },
    async profiles() { return must(await sb.from("profiles").select("*").order("created_at")); },
    async saveProfile(p) {
      if (people.find((x) => x.id === me.id)) must(await sb.from("profiles").update(p).eq("id", me.id));
      else must(await sb.from("profiles").insert({ id: me.id, ...p }));
    },
    async events(from, to) {
      return must(await sb.from("events").select("*")
        .lte("event_date", to).or(`event_date.gte.${from},end_date.gte.${from}`));
    },
    async ipos(from, to) {
      return must(await sb.from("ipo_events").select("kind,event_date").gte("event_date", from).lte("event_date", to));
    },
    async saveEvent(e) {
      const row = { title: e.title, event_date: e.event_date, end_date: e.end_date, start_time: e.start_time, memo: e.memo };
      if (e.id) must(await sb.from("events").update(row).eq("id", e.id));
      else must(await sb.from("events").insert({ ...row, owner_id: me.id }));
    },
    async deleteEvent(id) { must(await sb.from("events").delete().eq("id", id)); },
    async saveSubscription(j) {
      must(await sb.from("push_subscriptions").upsert(
        { user_id: me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: "endpoint" }));
    },
    async testPush() {
      const { data, error } = await sb.functions.invoke("notify", { body: { test: true } });
      if (error) throw error;
      if (!data?.sent) throw new Error("이 폰에 등록된 알림이 없어요. 먼저 [알림 켜기]를 눌러주세요.");
    },
  };
}

// ---------- 상태 ----------
let me = null, people = [], events = [], ipos = [];
let cursor = new Date(); cursor.setDate(1);
let selected = todayStr();
let editing = null;
let pickedColor = COLORS[0];
const personOf = (id) => people.find((p) => p.id === id) || { name: "?", color: "#999" };
const freeColor = () => COLORS.find((c) => !people.some((p) => p.color === c)) || COLORS[people.length % COLORS.length];

function show(view) {
  for (const v of ["authView", "profileView", "mainView"]) $(v).classList.toggle("hidden", v !== view);
}

// ---------- 시작 ----------
async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  me = await api.session();
  if (!me) return show("authView");
  people = pastel(await api.profiles());
  if (!people.find((p) => p.id === me.id)) {
    // 가입할 때 입력한 이름으로 바로 프로필 만들기
    const n = me.user_metadata?.name || "";
    if (NAME_OK.test(n)) { await api.saveProfile({ name: n, color: freeColor() }); people = pastel(await api.profiles()); }
    else return show("profileView");
  }
  show("mainView");
  await refresh();
  updatePushUI();
}

// ---------- 로그인 / 회원가입 ----------
let signupMode = false;
function setAuthMode(up) {
  signupMode = up;
  $("nameWrap").classList.toggle("hidden", !up);
  $("authTitle").textContent = up ? "회원가입" : "가족캘린더";
  $("authSub").textContent = up ? "가족에게 보일 이름과 로그인 정보를 입력해 주세요" : "우리 가족 일정을 한곳에서";
  $("authBtn").textContent = up ? "가입하기" : "로그인";
  $("authSwitch").textContent = up ? "이미 계정이 있어요 · 로그인" : "처음이에요 · 회원가입";
  $("password").autocomplete = up ? "new-password" : "current-password";
  $("authMsg").textContent = "";
  if (up) setTimeout(() => $("signName").focus(), 50);
}
$("authSwitch").onclick = () => setAuthMode(!signupMode);
$("signName").oninput = () => {
  const v = $("signName").value.trim();
  $("signName").classList.toggle("bad", v.length >= 2 && !NAME_OK.test(v));
};
$("authBtn").onclick = async () => {
  const email = $("email").value.trim(), pw = $("password").value, name = $("signName").value.trim();
  $("authMsg").textContent = "";
  if (signupMode && nameError(name)) { $("authMsg").textContent = nameError(name); return; }
  if (!email || pw.length < 6) { $("authMsg").textContent = "이메일과 6자 이상 비밀번호를 입력해 주세요."; return; }
  $("authBtn").disabled = true;
  try {
    if (signupMode) await api.signUp(email, pw, name); else await api.signIn(email, pw);
    await boot();
  } catch (e) {
    const m = e.message || "";
    $("authMsg").textContent = m === "Invalid login credentials" ? "이메일 또는 비밀번호가 맞지 않아요."
      : /already registered/i.test(m) ? "이미 가입된 이메일이에요. 로그인해 주세요." : m;
  }
  $("authBtn").disabled = false;
};
$("pfSave").onclick = async () => {
  const name = $("pfName").value.trim();
  if (nameError(name)) { $("pfMsg").textContent = nameError(name); return; }
  try { await api.saveProfile({ name, color: freeColor() }); boot(); } catch (e) { $("pfMsg").textContent = e.message; }
};

// ---------- 달력 ----------
function gridRange() {
  const first = new Date(cursor); const start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
  return [ymd(start), ymd(end)];
}

function eventsOn(day) {
  return events
    .filter((e) => e.event_date <= day && (e.end_date || e.event_date) >= day)
    .sort((a, b) => (a.start_time || "").localeCompare(b.start_time || "") || a.title.localeCompare(b.title));
}
const colorOf = (e) => personOf(e.owner_id).color;

// 공모주: 종목 이름 없이 "청약마감", "상장"만 (여러 개면 개수)
function ipoLabels(day) {
  const c = ipos.filter((i) => i.event_date === day && i.kind === "closing").length;
  const l = ipos.filter((i) => i.event_date === day && i.kind === "listing").length;
  const out = [];
  if (c) out.push("청약마감" + (c > 1 ? " " + c : ""));
  if (l) out.push("상장" + (l > 1 ? " " + l : ""));
  return out;
}

async function refresh() {
  const [from, to] = gridRange();
  try { people = pastel(await api.profiles()); events = await api.events(from, to); }
  catch (e) { toast("불러오기 실패: " + e.message); }
  try { ipos = await api.ipos(from, to); } catch { ipos = []; }
  render();
}

function render() {
  const mine = personOf(me.id);
  $("myBtn").textContent = mine.name; $("myBtn").style.background = mine.color;
  $("monthTitle").textContent = `${cursor.getFullYear()}년 ${cursor.getMonth() + 1}월`;
  $("legend").innerHTML = people.map((p) => `<span><i style="background:${p.color}"></i>${esc(p.name)}</span>`).join("");

  const [from, to] = gridRange();
  const month = cursor.getMonth(), today = todayStr();
  let html = "";
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const dt = parse(d), list = eventsOn(d), dow = dt.getDay();
    const cls = ["day", dt.getMonth() !== month && "out", dow === 0 && "sun", dow === 6 && "sat", d === today && "today", d === selected && "sel"].filter(Boolean).join(" ");
    const bars = list.slice(0, 3).map((e) => `<div class="bar" style="background:${colorOf(e)}">${esc(e.title)}</div>`).join("");
    const more = list.length > 3 ? `<div class="more">+${list.length - 3}</div>` : "";
    // 가족 일정이 우선: 일정이 3개 이상인 날은 공모주를 숨기고, 2개면 한 줄로 합침
    const labels = ipoLabels(d), room = list.length >= 3 ? 0 : list.length === 2 ? 1 : 2;
    let ipoHtml = "";
    if (room >= labels.length) ipoHtml = labels.map((x) => `<div class="ipo">${x}</div>`).join("");
    else if (room === 1) ipoHtml = `<div class="ipo">${labels.join("·")}</div>`;
    html += `<div class="${cls}" data-d="${d}"><div class="num">${dt.getDate()}</div>${bars}${more}${ipoHtml}</div>`;
  }
  $("grid").innerHTML = html;
  renderDay();
}

function renderDay() {
  const dt = parse(selected);
  $("dayTitle").textContent = `${dt.getMonth() + 1}월 ${dt.getDate()}일 ${WEEK[dt.getDay()]}요일`;
  const list = eventsOn(selected);
  let html = list.length ? list.map((e) => {
    const time = e.start_time ? e.start_time.slice(0, 5) : "하루 종일";
    const range = e.end_date && e.end_date !== e.event_date ? ` · ~${parse(e.end_date).getMonth() + 1}/${parse(e.end_date).getDate()}` : "";
    return `<div class="item" data-id="${e.id}"><div class="dot" style="background:${colorOf(e)}"></div>
      <div><div class="t">${esc(e.title)}</div><div class="m">${time}${range} · ${esc(personOf(e.owner_id).name)}${e.memo ? " · " + esc(e.memo) : ""}</div></div></div>`;
  }).join("") : `<div class="empty">일정이 없어요. + 버튼으로 추가해 보세요.</div>`;
  const labels = ipoLabels(selected);
  if (labels.length) html += `<div class="ipo-sec"><span>공모주</span>${labels.map((x) => `<span>${x}</span>`).join("")}</div>`;
  $("dayItems").innerHTML = html;
}

$("grid").onclick = (e) => {
  const cell = e.target.closest(".day"); if (!cell) return;
  if (selected === cell.dataset.d) return openEditor(null);
  selected = cell.dataset.d;
  const dt = parse(selected);
  if (dt.getMonth() !== cursor.getMonth()) { cursor = new Date(dt.getFullYear(), dt.getMonth(), 1); refresh(); } else render();
};
$("dayItems").onclick = (e) => { const it = e.target.closest(".item"); if (it) openEditor(events.find((x) => String(x.id) === it.dataset.id)); };
$("prevBtn").onclick = () => { cursor.setMonth(cursor.getMonth() - 1); refresh(); };
$("nextBtn").onclick = () => { cursor.setMonth(cursor.getMonth() + 1); refresh(); };
$("todayBtn").onclick = () => { selected = todayStr(); cursor = new Date(); cursor.setDate(1); refresh(); };
$("addBtn").onclick = () => openEditor(null);
document.addEventListener("visibilitychange", () => { if (!document.hidden && me && !$("mainView").classList.contains("hidden")) refresh(); });

// ---------- 창 열고 닫기 ----------
function openSheet(id) { $("scrim").classList.add("show"); $(id).classList.add("show"); }
function closeSheets() { $("scrim").classList.remove("show"); document.querySelectorAll(".sheet").forEach((s) => s.classList.remove("show")); }
$("scrim").onclick = closeSheets;

// ---------- 일정 추가/수정 ----------
$("evAllDay").onchange = () => $("evTimeWrap").classList.toggle("hidden", $("evAllDay").checked);

function openEditor(ev) {
  editing = ev;
  $("evHead").textContent = ev ? `일정 수정 · ${personOf(ev.owner_id).name}` : "일정 추가";
  $("evTitle").value = ev?.title || "";
  $("evDate").value = ev?.event_date || selected;
  $("evEnd").value = ev?.end_date || "";
  $("evAllDay").checked = !ev?.start_time;
  $("evTime").value = ev?.start_time ? ev.start_time.slice(0, 5) : "09:00";
  $("evTimeWrap").classList.toggle("hidden", $("evAllDay").checked);
  $("evMemo").value = ev?.memo || "";
  $("evMsg").textContent = "";
  $("evDel").classList.toggle("hidden", !ev);
  openSheet("evSheet");
  if (!ev) setTimeout(() => $("evTitle").focus(), 250);
}
$("evCancel").onclick = closeSheets;
$("evSave").onclick = async () => {
  const title = $("evTitle").value.trim(), date = $("evDate").value, end = $("evEnd").value;
  if (!title || !date) { $("evMsg").textContent = "일정 이름과 날짜를 입력해 주세요."; return; }
  if (end && end < date) { $("evMsg").textContent = "마지막 날이 시작 날짜보다 빨라요."; return; }
  $("evSave").disabled = true;
  try {
    await api.saveEvent({
      id: editing?.id, title, event_date: date, end_date: end && end !== date ? end : null,
      start_time: $("evAllDay").checked ? null : $("evTime").value, memo: $("evMemo").value.trim() || null,
    });
    selected = date; closeSheets(); await refresh(); toast("저장했어요");
  } catch (e) { $("evMsg").textContent = e.message; }
  $("evSave").disabled = false;
};
$("evDel").onclick = async () => {
  if (!editing) return;
  try { await api.deleteEvent(editing.id); closeSheets(); await refresh(); toast("삭제했어요"); }
  catch (e) { $("evMsg").textContent = e.message; }
};

// ---------- 푸시 알림 ----------
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function updatePushUI() {
  const banner = $("pushBanner");
  let state, btn = "알림 켜기", on = false, bannerHtml = "";
  if (DEMO) { state = "데모 모드에서는 알림이 동작하지 않아요"; }
  else if (!isStandalone() && /iPhone|iPad/.test(navigator.userAgent)) {
    state = "홈 화면에 추가한 앱에서만 알림을 받을 수 있어요";
    bannerHtml = `<span>📲 사파리 <b>공유 버튼 → 홈 화면에 추가</b> 후, 홈 화면 아이콘으로 열어주세요</span>`;
  } else if (!pushSupported()) { state = "이 기기·브라우저는 알림을 지원하지 않아요 (iOS 16.4 이상 필요)"; }
  else if (Notification.permission === "granted") { state = "켜져 있어요"; btn = "다시 등록"; on = true; }
  else if (Notification.permission === "denied") { state = "꺼져 있어요 · 아이폰 설정 > 알림 > 가족캘린더에서 켜주세요"; }
  else { state = "아직 켜지 않았어요"; bannerHtml = `<span>🔔 일정 알림을 받으려면</span><button id="bannerPush">알림 켜기</button>`; }
  $("pushState").textContent = state;
  $("pushBtn").textContent = btn;
  $("pushBtn").classList.toggle("off", on);
  banner.innerHTML = bannerHtml;
  banner.classList.toggle("hidden", !bannerHtml);
  const bp = $("bannerPush"); if (bp) bp.onclick = enablePush;
}

function b64ToBytes(b64) {
  const s = (b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
}

async function enablePush() {
  if (DEMO) return toast("데모 모드에서는 알림을 켤 수 없어요");
  if (!pushSupported()) return toast("홈 화면에 추가한 앱에서 다시 시도해 주세요");
  if (!CFG.VAPID_PUBLIC_KEY) return toast("config.js 에 VAPID_PUBLIC_KEY 가 비어 있어요");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { updatePushUI(); return toast("알림이 허용되지 않았어요"); }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(CFG.VAPID_PUBLIC_KEY) });
    await api.saveSubscription(sub.toJSON());
    toast("알림을 켰어요 🔔");
  } catch (e) { toast("알림 등록 실패: " + e.message); }
  updatePushUI();
}
$("pushBtn").onclick = enablePush;
$("testBtn").onclick = async () => {
  $("testBtn").disabled = true;
  try { await api.testPush(); if (!DEMO) toast("보냈어요! 잠시 후 알림을 확인해 보세요"); } catch (e) { toast(e.message); }
  $("testBtn").disabled = false;
};

// ---------- 마이페이지 ----------
function renderSwatches() {
  const box = $("mySwatches");
  box.innerHTML = COLORS.map((c) => `<button class="swatch ${c === pickedColor ? "on" : ""}" style="background:${c}" data-c="${c}"></button>`).join("");
}
$("mySwatches").onclick = (e) => { const c = e.target.dataset.c; if (c) { pickedColor = c; renderSwatches(); } };

$("myBtn").onclick = () => {
  const mine = personOf(me.id);
  $("myAvatar").textContent = mine.name; $("myAvatar").style.background = mine.color;
  $("myName").textContent = mine.name; $("myEmail").textContent = me.email || "";
  $("myNameInput").value = mine.name; $("myNameInput").classList.remove("bad");
  pickedColor = mine.color; renderSwatches();
  document.querySelectorAll("[data-alert]").forEach((el) => {
    const k = el.dataset.alert; el.checked = k === "alert_events" ? mine[k] !== false : mine[k] === true;
  });
  updatePushUI(); openSheet("mySheet");
};
document.querySelectorAll("[data-alert]").forEach((el) => {
  el.onchange = async () => {
    const k = el.dataset.alert, on = el.checked;
    el.disabled = true;
    try { await api.saveProfile({ [k]: on }); personOf(me.id)[k] = on; toast(on ? "알림을 켰어요" : "알림을 껐어요"); }
    catch (e) { el.checked = !on; toast(e.message); }
    el.disabled = false;
  };
});
$("mySave").onclick = async () => {
  const name = $("myNameInput").value.trim();
  if (nameError(name)) { $("myNameInput").classList.add("bad"); return toast(nameError(name)); }
  $("myNameInput").classList.remove("bad");
  try {
    await api.saveProfile({ name, color: pickedColor }); await refresh();
    $("myName").textContent = name; $("myAvatar").textContent = name; $("myAvatar").style.background = pickedColor;
    toast("저장했어요");
  } catch (e) { toast(e.message); }
};
$("myClose").onclick = closeSheets;
$("logoutBtn").onclick = () => api.signOut();

boot();
</script>
